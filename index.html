<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة سعر الليرة عبر الذكاء الاصطناعي والمستعرض الذكي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; padding: 40px; }
        .card-box { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; margin: auto; text-align: center; }
        .price-tag { font-size: 2.2rem; font-weight: 800; color: #10b981; margin: 15px 0; }
        .raw-data { background: #111c44; color: #fff; border-radius: 8px; padding: 15px; font-size: 0.85rem; text-align: left; direction: ltr; max-height: 150px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card-box">
        <h4 class="fw-bold mb-3">سعر الدولار - قراءة ذكية مباشرة</h4>
        <div id="status" class="text-muted small mb-2">اضغط على الزر لجلب البيانات...</div>
        <div class="price-tag" id="price-display">---</div>
        <button id="btn-fetch" class="btn btn-primary w-100 fw-bold mt-2">جلب السعر الآن</button>
        
        <!-- لعرض النص القادم من الموقع للتأكد من نجاح القراءة -->
        <div class="raw-data" id="raw-output">النص المستخرج سيظهر هنا...</div>
    </div>

    <script>
        const btnFetch = document.getElementById('btn-fetch');
        const statusEl = document.getElementById('status');
        const priceDisplay = document.getElementById('price-display');
        const rawOutput = document.getElementById('raw-output');

        async function fetchWithAIReader() {
            btnFetch.disabled = true;
            statusEl.innerText = "جاري الاتصال بالمستعرض الذكي لتجاوز الحماية...";
            statusEl.className = "text-warning small mb-2 fw-bold";

            // رابط الموقع المستهدف
            const targetUrl = 'https://sp-today.com/currency/us-dollar';
            // دمج الرابط مع خدمة القراءة الذكية
            const readerUrl = 'https://r.jina.ai/' + targetUrl;

            try {
                const response = await fetch(readerUrl);
                if (!response.ok) throw new Error('فشل الاتصال بالخدمة الذكية');

                // النص المستخرج يأتي بصيغة Markdown نظيفة جداً
                const markdownText = await response.text();
                rawOutput.innerText = markdownText; // لعرض النص الخام للاستكشاف

                // نبحث داخل النص المستخرج عن السعر (مثلاً عبر الكلمات الدلالية أو الأرقام الكبيرة)
                // بما أن الخدمة أعطتك محتوى الصفحة كنص، يمكنك استخراج الرقم المطلوب بسهولة
                statusEl.innerText = "تمت القراءة بنجاح!";
                statusEl.className = "text-success small mb-2 fw-bold";
                priceDisplay.innerText = "تم جلب البيانات (انظر الصندوق الأسود)";

            } catch (error) {
                console.error(error);
                statusEl.innerText = "حدث خطأ أثناء الاتصال.";
                statusEl.className = "text-danger small mb-2 fw-bold";
            } finally {
                btnFetch.disabled = false;
            }
        }

        btnFetch.addEventListener('click', fetchWithAIReader);
    </script>
</body>
</html>
